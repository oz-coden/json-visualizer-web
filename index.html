<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JSONの値と、JavaScriptから参照するためのパスを表示します。">
    <title>JSON Path Visualizer | oz-coden tools</title>
    <script src="vendor/ui/ui.js"></script>
    <link rel="stylesheet" href="vendor/ui/ui.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="ui-header" data-ui-header data-title="JSON Path Visualizer" data-source="https://github.com/oz-coden/json-visualizer-web">
        <a class="ui-brand" href="https://tools.oz-coden.com/">oz-coden tools</a>
    </header>
    <main class="ui-main ui-wide">
        <div class="ui-heading">
            <p class="ui-eyebrow">DATA TOOLS</p>
            <h1>JSON Path Visualizer</h1>
            <p class="ui-description">JSONの値と、JavaScriptから参照するためのパスを表示します。</p>
        </div>
        <div class="json-workspace">
            <section class="ui-panel">
                <h2><label for="jsonInput">JSONを入力</label></h2>
                <textarea id="jsonInput" spellcheck="false" placeholder="JSONを貼り付けるか、ファイルをドロップ">{
    "users": [
        {"name": "Alice", "active": true},
        {"name": "Bob", "active": false}
    ],
    "total": 2
}</textarea>
                <div class="ui-actions"><button class="action-btn" onclick="parseAndVisualize()">解析する</button><button class="reset-btn" onclick="resetAll()">リセット</button></div>
                <label for="jsonFile" class="file-label">JSONファイルを開く</label><input type="file" id="jsonFile" accept=".json,application/json">
            </section>
            <section class="ui-panel">
                <h2>JavaScriptでのアクセスパス</h2>
                <div id="outputArea" aria-label="解析結果"></div>
                <p id="json-status" class="ui-status" role="status"></p>
            </section>
        </div>
    </main>
</body>
</html>
